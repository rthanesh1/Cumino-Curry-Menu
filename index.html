        // =====================================================================
        function switchLanguage() {
            const selectedLanguage = document.getElementById("language-dropdown").value;
            const items = ["dish1", "dish2", "dish3", "dish4", "dish5", "dish6","dish7","dish8","dish9","dish10"];
            
            // 1. முதன்மைப் பக்க கார்டுகளின் பெயர்களை மாற்றுதல் (Menu Items Change)
            items.forEach(itemId => {
                const element = document.getElementById(itemId);
                if (element && menuTranslations && menuTranslations[selectedLanguage]) {
                    element.innerText = menuTranslations[selectedLanguage][itemId];
                }
            });

            // 2. Back பட்டனின் மொழியை மாற்றுதல் (Back Button Change)
            const backBtn = document.getElementById("back-btn-text");
            if (backBtn && menuTranslations && menuTranslations[selectedLanguage]) {
                backBtn.innerText = menuTranslations[selectedLanguage].backBtn;
            }

            // 3. கூகுள் ரிவியூ பட்டனின் மொழியை மாற்றுதல் (Google Review Text Change)
            const reviewTranslations = {
                es: "Por favor, danos tu valiosa reseña",
                en: "Please give your valuable review",
                pt: "Por favor, dê-nos a sua valiosa avaliação",
                de: "Bitte geben Sie uns Ihre wertvolle Bewertung",
                fr: "S'il vous plaît, donnez-nous votre précieux avis",
                zh: "请留下您宝贵的评价",
                hi: "कृपया अपनी बहुमूल्य समीक्षा (Review) दें"
            };

            const reviewBtnText = document.getElementById("review-btn-text");
            if (reviewBtnText && reviewTranslations[selectedLanguage]) {
                reviewBtnText.innerText = reviewTranslations[selectedLanguage];
            }

            // =====================================================================
            // திருத்தப்பட்ட பகுதி: சமூக ஊடகத் தலைப்பு மொழி மாற்றம் (Social Title Translate Fix)
            // =====================================================================
            const socialTitle = document.getElementById("social-title");
            if (socialTitle) {
                // "en" என்பதற்குப் பதிலாக பயனர் தேர்ந்தெடுத்த மொழியை (selectedLanguage) இங்கு மாற்றியுள்ளோம்
                const translatedSocialText = socialTitle.getAttribute("data-lang-" + selectedLanguage);
                if (translatedSocialText) {
                    socialTitle.innerText = translatedSocialText;
                }
            }

            // 4. உள் பக்கம் ஓப்பனில் இருந்தால், தற்போதைய ஸ்க்ரோல் பொசிஷனை மாறாமல் புதுப்பிக்கும்
            const innerPage = document.getElementById("inner-page");
            if (innerPage && innerPage.style.display === "block") {
                const currentScroll = window.scrollY;
                if (typeof generateAllItems === "function") {
                    generateAllItems();
                }
                window.scrollTo(0, currentScroll);
            }
        }

        const categoryTitle = menuTranslations[selectedLanguage][id];
        navBar.innerHTML += `
            <button class="nav-link-btn" onclick="scrollToSection('section-${id}')" style="background: #111111; color: #dfb76c; border: 1px solid #dfb76c; padding: 8px 15px; border-radius: 20px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease; white-space: nowrap;">
                ${categoryTitle}
            </button>
        `;
    });

    navBar.style.display = "flex";
    navBar.style.gap = "10px";
    navBar.style.overflowX = "auto";
    navBar.style.paddingBottom = "15px";
    navBar.style.marginBottom = "25px";
    navBar.style.scrollbarWidth = "none";

    // 2. கீழே உணவுகளை உருவாக்குதல்
    allDishes.forEach(id => {
        const categoryTitle = menuTranslations[selectedLanguage][id];
        
        // 🔽 இந்த இடத்தில் ஒவ்வொரு பிரிவிற்கும் தனித்துவமான அனிமேஷன் ஐகான் பெறப்படுகிறது 🔽
        const animationIcon = getMenuAnimationIcon(id);

                let sectionHTML = `
            <div id="section-${id}" class="category-section" style="grid-column: 1 / -1; margin-top: 40px; border-bottom: 2px solid #dfb76c; padding-bottom: 15px; scroll-margin-top: 100px; display: flex; justify-content: flex-start;">
                <h2 style="font-family: 'Poppins', sans-serif; color: #111111; font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; background-color: #ffffff; padding: 6px 14px; border: 1px solid #111111; outline: 2px solid #ffffff; box-shadow: 0 0 0 3px #dfb76c; display: inline-flex; align-items: center; gap: 10px; margin: 0;">
                    ${categoryTitle}
                    ${animationIcon}
                </h2>
            </div>
        `;
        container.innerHTML += sectionHTML;

                const itemsList = menuItemsData[id] || [];

        itemsList.forEach((item) => {
            // தேர்ந்தெடுத்த மொழிக்குரிய உரை துல்லியமாக எடுக்கப்படுகிறது 
            let itemName = item.name[selectedLanguage] || item.name['es'];
            const itemDesc = item.desc[selectedLanguage] || item.desc['es'];
            const itemPrice = item.price;
            const itemImg = item.img;

            // [VG] என்று இருந்தால் மட்டும் துல்லியமான வேகன் லோகோவாக மாற்றும் பகுதி
            if (itemName && itemName.includes("[VG]")) {
                itemName = itemName.replace("[VG]", `
                    <span class="animated-vegan-circle">
                        <svg class="vegan-custom-logo" viewBox="0 0 100 100" xmlns="http://w3.org">
                            <circle cx="50" cy="50" r="48" fill="#2e7d32" />
                            <path d="M26,25 C32,45 42,70 50,88 C58,70 68,45 74,25 C63,40 54,58 50,68 C46,58 37,40 26,25 Z 
                                     M52,62 C58,50 68,36 84,33 C72,42 66,54 58,68 Z" fill="#ffffff" />
                            <path d="M84,33 C86,22 74,20 66,28 C64,30 64,34 68,36 C74,38 80,40 84,33 Z" fill="#ffffff" />
                        </svg>
                    </span>
                `);
            }

            // 🔽 1. 10 பிரிவுகளின் புகைப்படங்களுக்கும் தனித்தனி அனிமேஷன்களைத் தீர்மானிக்கும் பகுதி 🔽
            let photoAnimationHTML = '';
            switch(id) {
                case 'dish1': // 1. SOPAS
                    photoAnimationHTML = `<div class="photo-overlay-anim soup-vapour"><span class="v-wave"></span><span class="v-wave"></span><span class="v-wave"></span></div>`;
                    break;
                case 'dish2': // 2. STARTERS
                    photoAnimationHTML = `<div class="photo-overlay-anim starter-spark"><span class="sparkle"></span><span class="sparkle"></span></div>`;
                    break;
                case 'dish3': // 3. SIDE DISHES
                    photoAnimationHTML = `<div class="photo-overlay-anim side-float"></div>`;
                    break;
                case 'dish4': // 4. VEGANO
                    photoAnimationHTML = `<div class="photo-overlay-anim vegan-leaves"><span class="v-leaf">🍃</span><span class="v-leaf">🌱</span></div>`;
                    break;
                case 'dish5': // 5. PLATOS PRINCIPALES
                    photoAnimationHTML = `<div class="photo-overlay-anim curry-bubble"><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span></div>`;
                    break;
                case 'dish6': // 6. ARROZ Y BIRYANI
                    photoAnimationHTML = `<div class="photo-overlay-anim biryani-steam"><span class="b-wave"></span><span class="b-wave"></span></div>`;
                    break;
                case 'dish7': // 7. BREAD & ROTI
                    photoAnimationHTML = `<div class="photo-overlay-anim bread-zoom"></div>`;
                    break;
                case 'dish8': // 8. DRINKS AND DESSERTS
                    photoAnimationHTML = `<div class="photo-overlay-anim drinks-chill"><span class="frost"></span><span class="frost"></span></div>`;
                    break;
                case 'dish9': // 9. CHEF'S SPECIAL
                    photoAnimationHTML = `<div class="photo-overlay-anim chef-stars"><span class="star">★</span><span class="star">★</span></div>`;
                    break;
                case 'dish10': // 10. CHRISTMAS SPECIAL
                    photoAnimationHTML = `<div class="photo-overlay-anim xmas-snow"><span class="snowflake">❄</span><span class="snowflake">❅</span><span class="snowflake">❄</span></div>`;
                    break;
            }

            // 🔽 2. அனிமேஷன் பெட்டியுடன் மிகச் சரியாக இணைக்கப்பட்ட புதிய கார்டு வடிவமைப்பு 🔽
            container.innerHTML += `
                <div class="item-card">
                    <div style="position: relative; overflow: hidden; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <img src="${itemImg}" alt="${item.name['en'] || 'dish'}" class="item-thumb" style="width: 100%; height: 100%; margin: 0; display: block; object-fit: cover;">
                        
                        <!-- 🚀 10 வெவ்வேறு புகைப்பட அனிமேஷன்கள் இங்கே செயல்படும் -->
                        ${photoAnimationHTML} 
                    </div>
                    
                    <div class="item-details">
                        <div class="item-name-row">
                            <span class="item-name" style="color: #0C29E8; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center;">${itemName}</span>
                            <span class="item-price" style="color: #0C29E8;font-weight: 600; font-size: 16px;">${itemPrice}</span>
                        </div>
                        <p class="item-description" style="color: #DD0CE8; font-size: 13px; margin-top: 5px; line-height: 1.4;">${itemDesc}</p>
                    </div>
                </div>
            `;
        });
    });
}

// பட்டனை அழுத்தினால் அந்த இடத்திற்கு மென்மையாக நகர்த்தும் செயல்பாடு
function scrollToSection(sectionId) {
    const targetSection = document.getElementById(sectionId);
    if (targetSection) {
        targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

// கார்டைக் கிளிக் செய்யும்போது குறிப்பிட்ட பகுதிக்கு ஸ்க்ரோல் செய்யும் செயல்பாடு
function openCategory(dishId) {
    generateAllItems();

    // பக்கங்களை மாற்றுதல்
    document.getElementById("main-page").style.display = "none";
    document.getElementById("inner-page").style.display = "block";

    setTimeout(() => {
        const targetSection = document.getElementById(`section-${dishId}`);
        if (targetSection) {
            targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }, 100);
}


// மீண்டும் முதன்மைப் பக்கத்திற்கு வர
function showMainPage() {
    document.getElementById("inner-page").style.display = "none";
    document.getElementById("main-page").style.display = "block";
}
