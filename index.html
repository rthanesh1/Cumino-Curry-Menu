        // ----------------------------------------------------
        // இந்த இடத்திலிருந்து கீழே உள்ள புதிய செயல்பாடுகளை மட்டும் மாற்றவும்
        // ----------------------------------------------------

        // மொழி மாற்றும் புதிய செயல்பாடு
        function switchLanguage() {
            const selectedLanguage = document.getElementById("language-dropdown").value;
            const items = ["dish1", "dish2", "dish3", "dish4", "dish5", "dish6"];
            
            // 1. முதன்மைப் பக்க கார்டுகளின் பெயர்களை மாற்றுதல்
            items.forEach(itemId => {
                document.getElementById(itemId).innerText = menuTranslations[selectedLanguage][itemId];
            });

            // 2. Back பட்டனின் மொழியை மாற்றுதல்
            document.getElementById("back-btn-text").innerText = menuTranslations[selectedLanguage].backBtn;

            // 3. உள் பக்கம் ஓப்பனில் இருந்தால், தற்போதைய ஸ்க்ரோல் பொசிஷனை மாறாமல் புதுப்பிக்கும்
            const innerPage = document.getElementById("inner-page");
            if (innerPage.style.display === "block") {
                const currentScroll = window.scrollY;
                generateAllItems();
                window.scrollTo(0, currentScroll);
            }
        }

        // உள் பக்கத்தில் அனைத்து பிரிவுகளையும் (20, 20 ஐட்டங்களாக) வரிசையாக உருவாக்கும் செயல்பாடு
               // உள் பக்கத்தில் அனைத்து பிரிவுகளையும், மேல் மெனு பாரையும், மற்றும் உங்களது அசல் உணவுகளையும் உருவாக்கும் செயல்பாடு
              // [object Object] என்ற பிழையைச் சரிசெய்து உணவுகளின் பெயர்களைக் காட்டும் புதிய செயல்பாடு
        function generateAllItems() {
            const selectedLanguage = document.getElementById("language-dropdown").value;
			const container = document.getElementById("items-container");
            const navBar = document.getElementById("quick-nav-bar");
            
            container.innerHTML = ""; // பழைய விபரங்களை அழிக்க
            navBar.innerHTML = "";    // பழைய மெनु பட்டன்களை அழிக்க

            const allDishes = ["dish1", "dish2", "dish3", "dish4", "dish5", "dish6"];

            // 1. மேல் மெனு பட்டன்களை உருவாக்குதல்
            allDishes.forEach(id => {
                const categoryTitle = menuTranslations[selectedLanguage][id];
                navBar.innerHTML += `
                    <button class="nav-link-btn" onclick="scrollToSection('section-${id}')" style="background: #111111; color: #dfb76c; border: 1px solid #dfb76c; padding: 8px 15px; border-radius: 20px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease; white-space: nowrap;">
                        ${categoryTitle}
                    </button>
                `;
            });

            navBar.style.display = "flex";
            navBar.style.gap = "10px";
            navBar.style.overflowX = "auto";
            navBar.style.paddingBottom = "15px";
            navBar.style.marginBottom = "25px";
            navBar.style.scrollbarWidth = "none";

            // 2. கீழே உணவுகளை உருவாக்குதல்
            allDishes.forEach(id => {
                const categoryTitle = menuTranslations[selectedLanguage][id];

                let sectionHTML = `
                    <div id="section-${id}" class="category-section" style="grid-column: 1 / -1; margin-top: 40px; border-bottom: 2px solid #dfb76c; padding-bottom: 10px; scroll-margin-top: 100px;">
                        <h2 style="font-family: 'Cinzel', serif; color: #dfb76c; font-size: 24px;">${categoryTitle}</h2>
                    </div>
                `;
                container.innerHTML += sectionHTML;

                const itemsList = menuItemsData[id] || [];

                itemsList.forEach((item) => {
                    // >>> இங்கேதான் மாற்றம் செய்யப்பட்டுள்ளது: தேர்ந்தெடுத்த மொழிக்குரிய உரை துல்லியமாக எடுக்கப்படுகிறது <<<
                    const itemName = item.name[selectedLanguage] || item.name['es'];
                    const itemDesc = item.desc[selectedLanguage] || item.desc['es'];
                    const itemPrice = item.price;
                    const itemImg = item.img;

                    container.innerHTML += `
                        <div class="item-card">
                            <img src="${itemImg}" alt="${itemName}" class="item-thumb">
                            <div class="item-details">
                                <div class="item-name-row">
                                    <span class="item-name" style="color: #0C29E8; font-weight: 600; font-size: 16px;">${itemName}</span>
                                    <span class="item-price" style="color: #0C29E8;font-weight: 600; font-size: 16px;">${itemPrice}</span>
                                </div>
                                <p class="item-description" style="color: #DD0CE8; font-size: 13px; margin-top: 5px; line-height: 1.4;">${itemDesc}</p>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // பட்டனை அழுத்தினால் அந்த இடத்திற்கு மென்மையாக நகர்த்தும் செயல்பாடு
        function scrollToSection(sectionId) {
            const targetSection = document.getElementById(sectionId);
            if (targetSection) {
                targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }


        // கார்டைக் கிளிக் செய்யும்போது குறிப்பிட்ட பகுதிக்கு ஸ்க்ரோல் செய்யும் செயல்பாடு
        function openCategory(dishId) {
            // முதலில் அனைத்து 6 பிரிவுகளையும் ஒரே பக்கத்தில் உருவாக்குகிறது
            generateAllItems();

            // பக்கங்களை மாற்றுதல்
            document.getElementById("main-page").style.display = "none";
            document.getElementById("inner-page").style.display = "block";

            // பயனர் கிளிக் செய்த குறிப்பிட்ட பிரிவிற்கு (உதாரணமாக Platos Principales) தானாகவே மென்மையாக ஸ்க்ரோல் செய்து அழைத்துச் செல்லும்
            setTimeout(() => {
                const targetSection = document.getElementById(`section-${dishId}`);
                if (targetSection) {
                    targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 100);
        }

        // மீண்டும் முதன்மைப் பக்கத்திற்கு வர
        function showMainPage() {
            document.getElementById("inner-page").style.display = "none";
            document.getElementById("main-page").style.display = "block";
        }
    </script>
